[package]
name = "forge-base"
version = "0.1.0"
edition = "2021"
description = "Moteur SQLite du module Base de donnees de ForgeOffice (equivalent Access)"
license = "UNLICENSED"
publish = false

[dependencies]
rusqlite = { version = "0.41", features = ["bundled", "hooks", "column_decltype", "collation", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
