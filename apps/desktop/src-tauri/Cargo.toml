[package]
name = "forgeoffice"
version = "0.1.0"
description = "ForgeOffice : suite bureautique (Texte, Tableur, Presentation, Publication, Base de donnees, PDF)"
authors = ["Heiphaistos"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "forgeoffice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

# Plugins bureau seulement : mise a jour, instance unique.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14"
tauri-plugin-single-instance = "2.5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
