[package]
name = "forge-convert"
version = "0.1.0"
edition = "2021"
description = "Moteur de conversion et d'outils PDF de ForgeOffice (repris et ameliore de ForgePDF)"
license = "UNLICENSED"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
base64 = "0.22"
getrandom = "0.4"
similar = "2"

# PDF (pur Rust)
lopdf = "0.42"

# Images
image = { version = "0.25", features = [
    "png", "jpeg", "webp", "bmp", "gif", "tiff", "ico", "tga",
    "pnm", "hdr", "avif", "qoi", "exr", "dds", "ff"
] }
resvg = "0.44"

# Documents
pulldown-cmark = "0.11"
zip = "9"
quick-xml = "0.41"
calamine = "0.36"
rust_xlsxwriter = "0.93"
csv = "1"
epub = "2"
epub-builder = "0.7"
docx-rs = "0.4"
htmd = "0.1"

# Donnees structurees
serde_yaml = "0.9"
toml = "0.8"

# Archives
tar = "0.4"
flate2 = "1"
sevenz-rust2 = "0.22"

# Audio
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "vorbis", "flac"] }
hound = "3.5"
flacenc = "0.4"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
