[package]
name = "forgeoffice"
version = "0.4.0"
description = "ForgeOffice : suite bureautique (Texte, Tableur, Presentation, Publication, Base de donnees, PDF)"
authors = ["Heiphaistos"]
edition = "2021"
rust-version = "1.83"
license-file = "../../../LICENSE"

[lib]
name = "forgeoffice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
base64 = "0.22"
# Moteur SQLite du module Base de donnees.
forge-base = { path = "../../../crates/forge-base" }
# Moteur de conversion et d'outils PDF (modules PDF et Convertisseur).
forge-convert = { path = "../../../crates/forge-convert" }

# Plugins bureau seulement : mise a jour, instance unique.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14"
tauri-plugin-single-instance = "2.5"

# Boite de dialogue native avant toute fenetre (WebView2 absent, echec de demarrage).
# Deja tiree par tauri-plugin-dialog : aucune dependance nouvelle.
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17", default-features = false }

[features]
# Executable portable unique : `--features portable` (mise a jour par remplacement de l'exe).
portable = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind"
strip = "symbols"
